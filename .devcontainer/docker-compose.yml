services:
  app:
    image: mcr.microsoft.com/devcontainers/base:trixie
    volumes:
      - ..:/workspaces/chosenone:cached
    depends_on:
      - db
    command: sleep infinity

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dues
      POSTGRES_PASSWORD: dues
      POSTGRES_DB: duestracker
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: